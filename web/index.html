<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Inkwell</title>
  <link rel="stylesheet" href="https://unpkg.com/@knadh/oat/oat.min.css" />
  <link rel="stylesheet" href="style.css" />
  <!--
    Script order matters:
    - app.js loads first to register Alpine.data('inkwell', …) on the
      alpine:init event.
    - alpine.js loads second and fires alpine:init during its own startup.
    Both must be `defer` so they run after <body> is parsed; without defer,
    Alpine tries to init during <head> parsing and bails out.
  -->
  <script defer src="app.js"></script>
  <script defer src="https://unpkg.com/alpinejs@3/dist/cdn.min.js"></script>
</head>
<body x-data="inkwell">
  <h1>Inkwell <span>/ writing assistant</span></h1>

  <div class="layout">
    <div class="pane">
      <h2>Your draft</h2>
      <textarea
        x-model="content"
        :disabled="locked || busy"
        placeholder="Paste or write your draft here…"
      ></textarea>

      <div class="modes" role="group" aria-label="Writing mode">
        <label>
          <input type="radio" x-model="mode" value="academic" />
          <span>Academic</span>
        </label>
        <label>
          <input type="radio" x-model="mode" value="journalist" />
          <span>Journalist</span>
        </label>
        <label>
          <input type="radio" x-model="mode" value="engineer" />
          <span>Engineer</span>
        </label>
      </div>

      <div class="controls">
        <input
          x-model="prompt"
          type="text"
          placeholder="How should I improve this?"
          :disabled="busy"
          @keydown.enter="submit"
        />
        <button @click="submit" :disabled="busy" x-text="busy ? 'Thinking…' : 'Improve'"></button>
      </div>
      <div class="status" :class="{ error: isError }" x-text="status" aria-live="polite"></div>
    </div>

    <div class="pane">
      <h2>Revisions</h2>
      <div id="thread" aria-live="polite">
        <p class="thread-empty" x-show="thread.length === 0">
          Revisions will appear here as you request them…
        </p>
        <template x-for="turn in thread" :key="turn.turn">
          <div class="turn">
            <div class="meta">
              <span class="prompt" x-text="`Turn ${turn.turn}: ${turn.prompt}`"></span>
              <span class="mode-badge" x-text="turn.mode"></span>
            </div>
            <div class="completion" x-text="turn.completion"></div>
          </div>
        </template>
      </div>
    </div>
  </div>
</body>
</html>
